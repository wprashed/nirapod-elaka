version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirapod_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nirapod:password@postgres:5432/nirapod_elaka
      JWT_SECRET: production-grade-secret-must-be-at-least-32-chars-long
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    container_name: nirapod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nirapod_elaka
      POSTGRES_USER: nirapod
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirapod -d nirapod_elaka"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database exploration
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nirapod_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nirapod.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
